version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: tracker-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/student-tracker
      - JWT_SECRET=student_tracker_production_secret_key_2024
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo-data:
